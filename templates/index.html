<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.10.2/dist/umd/popper.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
    <script>
        {{ js_code|safe }}
    </script>
    
    <title>Login Page</title>

    <style>
        body {
            background-image: url('../static/assets/nec_background_img.jpeg'); /* Background image */
            background-size: cover;
            background-repeat:no-repeat;
            font-family: Arial, sans-serif;
        }

        .container {
            margin-top: 5rem;
        }

        .card {
            background-color: rgba(255, 255, 255, 0.9); /* Translucent white */
            border-radius: 10px;
            box-shadow: 0px 0px 10px 0px rgba(0,0,0,0.1);
        }

        .card-header {
            background-color: rgba(0, 0, 0, 0.03); /* Translucent light gray */
            border-bottom: none;
            text-align: center;
        }

        .form-group label {
            font-weight: bold;
        }

        .btn-primary {
            background-color: rgba(51, 91, 241, 0.9); /* Blue with alpha */
            border-color: rgba(51, 91, 241, 0.9); /* Blue with alpha */
            border-radius: 20px;
        }

        .btn-primary:hover {
            background-color: green; /* Blue with alpha */
            color:white;
            border-color: rgba(51, 91, 241, 0.7); /* Blue with alpha */
        }
    </style>
</head>

<body>
    {% for message in get_flashed_messages() %}
        <div class="alert alert-warning alert-dismissible fade show" role="alert">
            {{ message }}
            <button type="button" class="close" data-dismiss="alert" aria-label="Close">
            <span aria-hidden="true">&times;</span>
            </button>
        </div>
    {% endfor %}
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card">
                    <div class="card-header">
                        <h4 class="text-center">Login</h4>
                    </div>
                    <div class="card-body">
                        <form name="sentMessage" id="contactForm"  method="post" novalidate>
                            <div class="form-group">
                                <label for="username">Username</label>
                                <input type="text" name="username" class="form-control" id="username" placeholder="Enter your username">
                            </div>
                            <div class="form-group">
                                <label for="password">Password</label>
                                <input type="password" name="password" class="form-control" id="password" placeholder="Enter your password">
                            </div>
                            <button type="submit" class="btn btn-primary btn-block" id="sendMessageButton">Login</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

</body>

</html>
