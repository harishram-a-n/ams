<!DOCTYPE html>
<html>
<head>
  <title>Manage Tutors</title>
  <style>
    body {
      font-family: 'Poppins', sans-serif; 
      background-image: url("../static/assets/nec_background_img.jpeg");
      background-size: cover;
      margin: 0;
      padding: 0;
      background-color: rgba(0, 0, 0, 0.7);
      
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    
    .container {
      width: 70%;
      background-color: rgba(255, 255, 255, 0.9);
      border-radius: 10px;
      padding: 20px;
    }
    
    .a1 {
      text-decoration: none !important;
      color: white;
    }
    
    a {
      text-decoration: none;
      color: black;
    }
    
    h1 {
      color: #007bff;
      margin-bottom: 20px;
      text-align: center; 
    }
    
    table {
      border-collapse: collapse;
      width: 100%;
      margin-bottom: 20px;
      border-radius: 5px; 
      box-shadow: 0 0 5px rgba(0, 0, 0, 0.1);
      background-color: #ffffff;
      opacity: 1;
    }
    th, td {
      border: 1px solid #ddd;
      padding: 12px;
      text-align: left;
    }
    
    th {
      background-color: #007bff;
      color: white;
      font-weight: bold; 
    }
    
    .btn {
      background-color: #007bff;
      color: white;
      padding: 10px 20px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      margin-right: 10px; 
    }
    
    .btn:hover {
      background-color: #0056b3;
    }
    
    .add-tutor-container {
      text-align: right;
      margin-bottom: 20px; 
    }

    .btn-remove {
      background: none;
      border: none;
      padding: 0;
      color: blue;
      text-decoration: none;
      cursor: pointer;
    }

    .btn-remove:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body><center>
  <div class="container">
    <h1>Manage Tutors</h1>

    <div class="add-tutor-container">
      <form action="/add/tutor">
        <button type="submit" name="tutor_remove" class="btn add-tutor-btn"><span class="a1">Add Tutor</span></button>
      </form>
    </div>

    <table>
      <thead>
        <tr>
          <th>Name</th>
          <th>Subject</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody>
        {% for tutor in tutors %}
          <tr>
            <td>{{ tutor[0] }}</td>
            <td>{{ tutor[1] }}</td>
            <td>
              <form name="sentMessage" id="contactForm" method="post" novalidate>
                <button type="submit" class="btn-remove" name="{{ tutor[0] }}">
                  <i class="fas fa-paper-plane"></i> Delete
                </button>
              </form>
            </td>
          </tr>
        {% endfor %}
      </tbody>
    </table>
  </div></center>
</body>
</html>
