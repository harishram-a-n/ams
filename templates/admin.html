<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>AMS - Admin Management System</title>

    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/css/bootstrap.min.css">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-datepicker/1.9.0/css/bootstrap-datepicker.min.css">

    <style>
        body {
            background-image: url('../static/assets/nec_background_img.jpeg'); /* Added background image */
            background-size: cover;
            
            background-repeat: no-repeat;
            font-family: Arial, sans-serif;
            background-color: #f8f9fa;
        }
        .container {
            padding-top: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }
        .navbar-toggler-icon {
            background-image: url("data:image/svg+xml;charset=utf8,%3Csvg viewBox='0 0 30 30' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath stroke='rgba(0, 0, 0, 0.5)' stroke-width='2' stroke-linecap='round' stroke-miterlimit='10' d='M4 7h22M4 15h22M4 23h22'/%3E%3C/svg%3E");
        }
        .navbar-toggler {
            border: none;
            background-color:rgba(51, 91, 241, 0.9) ;
        }
        .dropdown-menu {
            background-color: rgba(255, 255, 255, 0.9); /* Blue with alpha */
            border-radius: 10px;
            box-shadow: 0px 0px 10px 0px rgba(0, 0, 0, 0.1);
        }

        .dropdown-item {
            color: #000000;
            padding: 10px 15px;
        }

        .dropdown-item:hover {
            background-color: rgb(0, 0, 0); /* Blue with alpha */
            color: white;
        }
        .form-box {
            background-color: rgba(255, 255, 255, 0.9); /* Translucent white */
            border-radius: 10px;
            box-shadow: 0px 0px 10px 0px rgba(0,0,0,0.1);
            padding: 20px;
        }
        
        .table-container {
            background-color: rgba(255, 255, 255, 0.9); /* Translucent white */
            border-radius: 10px;
            box-shadow: 0px 0px 10px 0px rgba(0,0,0,0.1);
            padding: 20px;
        }
        
        .form-group label {
            font-weight: bold;
        }
        .btn-primary {
            background-color: rgba(51, 91, 241, 0.9); /* Blue with alpha */
            border-color: rgba(51, 91, 241, 0.9); /* Blue with alpha */
            border-radius: 20px;
        }
        .btn-primary:hover {
            background-color: green; /* Blue with alpha */
            color:white;
            border-color: rgba(51, 91, 241, 0.7); /* Blue with alpha */
        }
        .btn-download,
        .btn-report-download {
            border-radius: 20px;
            margin-right: 10px;
        }
        .btn-download:hover,
        .btn-report-download:hover {
            background-color: green; /* Blue with alpha */
            color:white;
            border-color: rgba(51, 91, 241, 0.7);  
        }
        .form-control {
            border-radius: 20px;
        }
        .table th {
            color: #000000;
            background-color: #000000;
            color: #ffffff;
        }
        .table th.regno {
            color: rgba(51, 91, 241, 0.9);
            background-color: transparent;
        }
    </style>
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-light bg-light">
        <div class="container">
            <a class="navbar-brand" href="#" style="font-weight: bold; font-size: 24px; color: #333;">AMS - Admin Management System</a>
            <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
    
            <div class="collapse navbar-collapse" id="navbarSupportedContent">
                <ul class="navbar-nav ml-auto">
                    <li class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle" href="#" id="navbarDropdown" role="button" data-toggle="dropdown" aria-haspopup="true" aria-expanded="false">
                            Manage
                        </a>
                        <div class="dropdown-menu" aria-labelledby="navbarDropdown">
                            <form action="/manage/tutors" method="post">
                                <button class="dropdown-item" type="submit">
                                    <i class="fas fa-chalkboard-teacher"></i> Manage Tutors
                                </button>
                            </form>
                            <form action="/manage/students" method="post">
                                <button class="dropdown-item" type="submit">
                                    <i class="fas fa-user-graduate"></i> Manage Students
                                </button>
                            </form>
                            <form action="/manage/attendance" method="post">
                                <button class="dropdown-item" type="submit">
                                    <i class="fas fa-calendar-check"></i> Manage Attendance
                                </button>
                            </form>
                            <form action="/manage/database" method="post">
                                <button class="dropdown-item" type="submit">
                                    <i class="fas fa-database"></i> Manage Database
                                </button>
                            </form>
                        </div>
                    </li>
                </ul>
            </div>
        </div>
    </nav>
    
    
    <!-- Main Content -->
    <div class="container mt-3">
        <div class="row justify-content-center">
            <div class="col-md-6 form-box">
                <form name="sentMessage" id="contactForm" method="post" novalidate>
                    <div class="form-group">
                        <label for="startDate"><i class="fas fa-calendar-alt"></i> Start Date:</label>
                        <input type="text" class="form-control datepicker" id="startDate" name="startDate" required>
                    </div>

                    <div class="form-group">
                        <label for="endDate"><i class="fas fa-calendar-alt"></i> End Date:</label>
                        <input type="text" class="form-control datepicker" id="endDate" name="endDate" required>
                    </div>

                    <div class="form-group text-center">
                        <button type="submit" class="btn btn-primary" name="submit"><i class="fas fa-paper-plane"></i> Submit</button>
                        <button type="submit" class="btn btn-download" name="download"><i class="fas fa-download"></i> Download</button>
                        <button type="submit" class="btn btn-report-download" name="monthly-report-download"><i class="fas fa-file-download"></i> Monthly Report Download</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Table Content -->
    <div class="container mt-5">
        <div class="table-container">
            <table class="table table-striped table-bordered">
                <thead>
                    <tr>
                        <th scope="col"><i class="fas fa-id-badge"></i> REGNO</th>
                        <th scope="col">NAME</th>
                        <th scope="col">REASON</th>
                        <th scope="col">DATE</th>
                    </tr>
                </thead>
                <tbody>
                    {% for i in data %}
                        <tr>
                            <th scope="row" class="regno">{{ i[0] }}</th>
                            <td>{{ i[1] }}</td>
                            <td>{{ i[2] }}</td>
                            <td>{{ i[3].strftime("%Y-%m-%d") }}</td>
                        </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.2.1.slim.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.12.9/umd/popper.min.js"></script>
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/js/bootstrap.min.js"></script>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-datepicker/1.9.0/js/bootstrap-datepicker.min.js"></script>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/js/all.min.js"></script>

    <script>
        $(document).ready(function(){
            $('.datepicker').datepicker({
                format: 'yyyy-mm-dd'
            });

            var today = new Date();
            var dd = String(today.getDate()).padStart(2, '0');
            var mm = String(today.getMonth() + 1).padStart(2, '0'); // January is 0!
            var yyyy = today.getFullYear();

            today = yyyy + '-' + mm + '-' + dd;
            $('#startDate').val(today);
            $('#endDate').val(today);
        });
    </script>
</body>
</html>
