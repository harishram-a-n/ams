<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <title>Student Attendance Management System</title>
  <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
  <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.10.2/dist/umd/popper.min.js"></script>
  <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
  <style>
    body {
      background-image: url('../static/assets/nec_background_img.jpeg');
      background-size: cover;
      background-position: center;
      font-family: Arial, sans-serif;
    }
    .container {
      padding-top: 50px;
      background-color: rgba(255, 255, 255, 0.7); /* Translucent white background */
      border-radius: 10px;
      box-shadow: 0px 0px 10px 0px rgba(0,0,0,0.1);
      animation: fadeInDown 0.5s ease;
    }
    @media (max-width: 768px) {
      .container {
        padding-top: 20px;
      }
    }
    @keyframes fadeInDown {
      from {
        opacity: 0;
        transform: translateY(-50px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
    h2 {
      color: #007bff;
      text-align: center;
      padding: 20px 0;
    }
    .form-control {
      width: 100%;
      border-radius: 20px;
    }
    .collapse.show {
      display: table-row;
    }
    .collapse td {
      padding: 10px 0;
    }
    .btn-primary {
      background-color: #007bff;
      border: none;
      border-radius: 20px;
      padding: 10px 20px;
    }
    .btn-primary:hover {
      background-color: #0056b3;
    }
  </style>
</head>
<body>
  {% for message in get_flashed_messages() %}
  <div class="alert alert-success alert-dismissible fade show" role="alert">
      {{ message }}
      <button type="button" class="close" data-dismiss="alert" aria-label="Close">
      <span aria-hidden="true">&times;</span>
      </button>
  </div>
{% endfor %}
<div class="container">
  <h2>Student Attendance Management</h2>

  <form name="sentMessage" id="contactForm" method="post" novalidate>
    <table class="table">
      <thead>
        <tr>
          <th>Name</th>
          <th>RegNo</th>
          <th>Absent</th>
        </tr>
      </thead>
      <tbody>

      {% for i in range(length) %}
        <tr>
          <td>{{ data[i][0] }}</td>
          <td>{{ data[i][1] }}</td>
          <td>
            <input type="checkbox" name="checkbox" value="{{ i }}" class="show-input-checkbox" data-toggle="collapse" data-target="#inputRow{{ i }}">
          </td>
        </tr>
        <tr id="inputRow{{ i }}" class="collapse">
          <td colspan="2">
            <div class="input-group">
              <input type="text" name="{{ i }}" class="form-control mr-1" placeholder="Reason">
            </div>
          </td>
        </tr>
      {% endfor %}

      </tbody>
    </table>

    <div class="form-group text-center">
      <button type="submit" class="btn btn-primary">Submit</button>
    </div>
  </form>
</div>

<script src="https://code.jquery.com/jquery-3.2.1.slim.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.12.9/umd/popper.min.js"></script>
<script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/js/bootstrap.min.js"></script>

</body>
</html>
