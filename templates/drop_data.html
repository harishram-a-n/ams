<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delete Records</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            font-family: Arial, sans-serif;
            background-image: url('../static/assets/nec_background_img.jpeg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            margin: 0;
            padding: 0;
            height: 100vh;
            
            justify-content: center;
            align-items: center;
            color: white;
        }

        .container {
            background-color: rgba(0, 0, 0, 0.7);
            padding: 20px;
            border-radius: 10px;
            
            justify content:center;

        }

        .btn-danger {
            background-color: #dc3545;
            border-color: #dc3545;
        }

        .btn-danger:hover {
            background-color: #c82333;
            border-color: #bd2130;
        }

        .btn-block {
            display: block;
            width: 100%;
        }

        .mt-5 {
            margin-top: 3rem;
        }

        .mb-3 {
            margin-bottom: 1rem;
        }

        .close {
            color: white;
            opacity: 1;
        }

        .close:hover {
            opacity: 0.75;
        }
    </style>
</head>
<body>
    {% for message in get_flashed_messages() %}
        <div class="alert alert-warning alert-dismissible fade show" role="alert">
            {{ message }}
            <button type="button" class="close" data-dismiss="alert" aria-label="Close" style="background-color: transparent; border:0; color:black; width:auto;>
            <span aria-hidden="true">&times;</span>
            </button>
        </div>
    {% endfor %}
    <div class="container">
        <center><h2 class="mt-5">Delete Records</h2></center>
        <form method="POST">
            <div class="row justify-content-center mt-3">
                <div class="col-6">
                    <button type="submit" class="btn btn-danger btn-lg btn-block mb-3" name="attendance" value="delete_attendance" onclick="return confirmDelete('attendance')">DELETE ATTENDANCE RECORDS</button>
                    <button type="submit" class="btn btn-danger btn-lg btn-block" name="student" value="delete_students" onclick="return confirmDelete('students')">DELETE STUDENT RECORDS</button>
                </div>
            </div>
        </form>
    </div>
    <script>
        function confirmDelete(recordsType) {
            var action = (recordsType === 'attendance') ? 'attendance records' : 'student records';
            return confirm("Are you sure you want to delete " + action + "?");
        }
    </script>
</body>
</html>
